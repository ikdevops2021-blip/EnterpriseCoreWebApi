name: core_session
description: Standalone enterprise session management module with secure storage, Dio interceptor, GoRouter refresh adapter, and Riverpod notifier.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
