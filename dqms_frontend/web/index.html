<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="A new Flutter project.">

  <script>
    // Force wipe any stale Flutter Service Worker and CacheStorage on load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let r of registrations) {
          r.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dqms_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dqms_frontend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.dqmsAudioContext = null;

    window.dqmsUnlockAudio = function() {
      try {
        if (!window.dqmsAudioContext) {
          window.dqmsAudioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (window.dqmsAudioContext.state === 'suspended') {
          window.dqmsAudioContext.resume();
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(' ');
          window.speechSynthesis.speak(u);
        }
        return true;
      } catch (e) {
        console.warn('DQMS Audio unlock warning:', e);
        return false;
      }
    };

    window.dqmsPlayChimeAndSpeak = function(text, tokenNumber, counterName, nextTokenNumber) {
      try {
        window.dqmsUnlockAudio();
        const ctx = window.dqmsAudioContext;
        if (ctx) {
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gainNode = ctx.createGain();

          gainNode.connect(ctx.destination);
          gainNode.gain.setValueAtTime(0.35, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

          // Standard 2-tone hospital announcement chime (D5 -> A5)
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          osc1.connect(gainNode);
          osc1.start(now);
          osc1.stop(now + 0.35);

          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880.00, now + 0.28);
          osc2.connect(gainNode);
          osc2.start(now + 0.28);
          osc2.stop(now + 0.9);
        }

        if ('speechSynthesis' in window) {
          setTimeout(function() {
            window.speechSynthesis.cancel();
            let spokenText = text || ('Token ' + (tokenNumber || '') + ', please proceed to Counter ' + (counterName || ''));
            if (nextTokenNumber && String(nextTokenNumber).trim().length > 0 && !spokenText.toLowerCase().includes('next token')) {
              spokenText += '. Next token, ' + String(nextTokenNumber).trim() + ', please get ready.';
            }
            const utterance = new SpeechSynthesisUtterance(spokenText);
            utterance.rate = 0.88;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            window.speechSynthesis.speak(utterance);
          }, 700);
        }
      } catch (e) {
        console.error('DQMS audio error:', e);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
